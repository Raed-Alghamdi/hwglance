[package]
name = "hwglance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "HWiNFO-style sensor table and Task Manager-style process tree for Linux"

[lib]
name = "hwglance"
path = "src/lib.rs"

[[bin]]
name = "hwglance"
path = "src/main.rs"

[dependencies]
hwglance-proto = { path = "../hwglance-proto" }
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "persistence", "default_fonts", "accesskit"] }
egui = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", features = ["image", "svg", "file"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-bidi = "0.3"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
