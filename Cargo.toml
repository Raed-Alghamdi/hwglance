[workspace]
resolver = "3"
members = [
    "crates/hwglance-proto",
    "crates/hwglanced",
    "crates/hwglance",
    "crates/hwglance-helper",
]
# vendor/ holds third-party source we patched: it is built as a dependency but is not ours to
# test, format or lint, so `--workspace` leaves it out (see vendor/eframe/PATCHED.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Raed-Alghamdi/hwglance"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# eframe 0.36.2 plus egui PR #8631 (the window froze on Wayland when the compositor stopped its
# frame callbacks). Every other egui crate stays on crates.io. Remove this section and
# vendor/eframe when egui 0.37 is released: see vendor/eframe/PATCHED.md.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
