# Monthly update PRs. Security fixes arrive separately (and sooner) once Dependabot security
# updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      # The egui crates must move together (two versions in one build do not compile), so every
      # update of them, major included, is one PR. Listed first so it wins over the group below.
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
      # Minor and patch updates in one PR; a major update gets its own PR.
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
