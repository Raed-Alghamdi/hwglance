  <g>
    <rect x="26" y="30" width="76" height="14" rx="7" fill="#263040"/>
    <rect x="26" y="30" width="52" height="14" rx="7" fill="#5AA8FF"/>
    <rect x="26" y="57" width="76" height="14" rx="7" fill="#263040"/>
    <rect x="26" y="57" width="34" height="14" rx="7" fill="#B591FF"/>
    <rect x="26" y="84" width="76" height="14" rx="7" fill="#263040"/>
    <rect x="26" y="84" width="64" height="14" rx="7" fill="#33D1E3"/>
  </g>
  <g fill="#ECF1F7">
    <rect x="76" y="27" width="4" height="20" rx="2"/>
